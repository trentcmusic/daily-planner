<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5b57bd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Day Planner">
    <meta name="description" content="A calm, flexible daily planner with 15-minute scheduling.">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
    <title>Daily Planner</title>
  </head>
  <body>
    <a class="skip-link" href="#schedule">Skip to schedule</a>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">One day at a time</p>
          <h1>Daily Planner</h1>
        </div>
        <div class="topbar-actions">
          <label class="date-control" for="planner-date">
            <span>Plan for</span>
            <input id="planner-date" name="planner-date" type="date" aria-describedby="date-help">
          </label>
          <span id="date-help" class="sr-only">Past dates are unavailable.</span>
          <button class="button button-primary" id="export-button" type="button">Export .ics</button>
        </div>
      </header>

      <main class="planner-layout">
        <aside class="palette-panel" aria-labelledby="actions-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Choose a next step</p>
              <h2 id="actions-title">Actions</h2>
            </div>
            <button class="icon-button mobile-only" id="close-palette" type="button" aria-label="Close actions">×</button>
          </div>
          <p class="helper">Drag an action onto the day, or tap it and then tap a time.</p>
          <div class="palette" id="palette"></div>
        </aside>

        <section class="schedule-panel" id="schedule" aria-labelledby="schedule-title">
          <div class="schedule-toolbar">
            <div>
              <p class="eyebrow" id="friendly-date">Today</p>
              <h2 id="schedule-title">Your day</h2>
            </div>
            <div class="schedule-actions">
              <button class="button mobile-only" id="open-palette" type="button">＋ Add action</button>
              <button class="button button-danger" id="trash-button" type="button" aria-label="Delete selected event" disabled>Delete</button>
            </div>
          </div>
          <div class="selection-hint" id="selection-hint" role="status" aria-live="polite">Nothing selected</div>
          <div class="timeline-wrap" id="timeline-wrap">
            <div class="timeline" id="timeline" role="grid" aria-label="24-hour schedule in 15-minute increments"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message">Event deleted.</span>
      <button id="undo-button" type="button">Undo</button>
    </div>
    <div class="live-region sr-only" id="live-region" aria-live="assertive"></div>
    <script type="module" src="./js/app.js?v=2"></script>
  </body>
</html>
